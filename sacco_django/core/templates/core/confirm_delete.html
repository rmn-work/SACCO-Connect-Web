<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
    <h2 class="text-xl font-bold text-red-600 mb-4">Confirmer la suppression</h2>
    <p class="text-gray-700 mb-6">Êtes-vous sûr de vouloir supprimer la transaction <strong>#{{ transaction.id }}</strong> d'un montant de {{ transaction.montant }} BIF ? Cette action est irréversible.</p>

    <form method="POST">
        {% csrf_token %}
        <div class="flex justify-end gap-3">
            <a href="{% url 'transaction_detail' transaction.id %}" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Annuler</a>
            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">Supprimer définitivement</button>
        </div>
    </form>
</div>
