<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - SACCO Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">SACCO Connect</h1>

        {% if error_message %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
                <p class="text-red-700 text-sm text-center">{{ error_message }}</p>
            </div>
        {% elif error %}
            <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
                <p class="text-red-700 text-sm text-center">{{ error }}</p>
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-4">
                <select name="user_type" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-shadow bg-white text-gray-700">
                    <option value="membre">Membre (Téléphone + PIN)</option>
                    <option value="partenaire">Partenaire</option>
                    <option value="admin">Administrateur</option>
                </select>
            </div>

            <button type="submit">Se connecter</button>

            <div class="mb-4">
                <input type="text" name="identifier" required placeholder="Identifiant / Téléphone"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
            </div>

            <div class="mb-6">
                <input type="password" name="secret" required placeholder="Mot de passe / Code PIN"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
            </div>

            <button type="submit"
                class="w-full bg-slate-800 text-white font-medium py-2.5 rounded-lg hover:bg-slate-700 transition-colors">
                Se connecter
            </button>
        </form>
    </div>
</body>
</html>
