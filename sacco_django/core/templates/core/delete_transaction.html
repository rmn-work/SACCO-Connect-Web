<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer la Transaction #{{ transaction.id }} - SaccoFINtech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md border border-red-100">
        <h1 class="text-xl font-bold mb-4 text-red-600">Confirmer la suppression</h1>
        <p class="text-gray-700 text-sm mb-6">
            Êtes-vous sûr de vouloir supprimer définitivement la transaction <strong>#{{ transaction.id }}</strong> d'un montant de <span class="font-semibold">{{ transaction.montant }} BIF</span> ? Cette action est irréversible.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-end gap-3">
                <a href="{% url 'core:transaction_detail' transaction.id %}" class="px-4 py-2 bg-gray-200 rounded text-sm font-medium hover:bg-gray-300">Annuler</a>
                <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded text-sm font-medium hover:bg-red-700">Confirmer la suppression</button>
            </div>
        </form>
    </div>
</body>
</html>
