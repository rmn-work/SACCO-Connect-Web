{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto py-8 px-4">
    <h1 class="text-2xl font-bold mb-6">Demande de Prêt</h1>

    <form method="post" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 font-medium">
            Soumettre la demande
        </button>
    </form>
</div>
{% endblock %}
