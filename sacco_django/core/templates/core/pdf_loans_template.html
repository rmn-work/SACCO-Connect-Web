<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #333; }
        h1 { text-align: center; color: #1f2937; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #6b7280; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
        th { background-color: #f3f4f6; color: #374151; font-weight: bold; }
    </style>
</head>
<body>
    <h1>SaccoFINtech - Historique des Prêts</h1>
    <p class="subtitle">Filtre appliqué : {{ current_status }}</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Membre</th>
                <th>Montant</th>
                <th>Statut</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for loan in loans %}
            <tr>
                <td>#{{ loan.id }}</td>
                <td>{{ loan.membre.nom }} {{ loan.membre.prenom }}</td>
                <td>{{ loan.montant }} BIF</td>
                <td>{{ loan.get_statut_display }}</td>
                <td>{{ loan.date_demande|date:"d/m/Y" }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
