{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto my-10 px-4 sm:px-6">
    <!-- Carte Principale -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">

        <!-- En-tête -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-800 px-8 py-6 text-white flex items-center justify-between">
            <div>
                <h3 class="text-2xl font-bold tracking-tight">Enregistrer un dépôt</h3>
                <p class="text-emerald-100 text-sm mt-1">Effectuez un dépôt d'épargne en toute sécurité sur le compte d'un membre.</p>
            </div>
            <div class="hidden sm:block bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
            </div>
        </div>

        <!-- Formulaire -->
        <form method="POST" class="p-8 space-y-8">
            {% csrf_token %}

            <!-- Section unique: Détails de la Transaction -->
            <div class="space-y-4">
                <div class="flex items-center gap-2 text-emerald-700 border-b border-gray-200 pb-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <h4 class="text-lg font-bold">Détails de la Transaction</h4>
                </div>

                <div class="space-y-6">
                    <!-- Membre -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Membre bénéficiaire</label>
                        <div class="[&>select]:w-full [&>select]:px-4 [&>select]:py-2.5 [&>select]:rounded-lg [&>select]:border [&>select]:border-gray-300 [&>select]:focus:ring-2 [&>select]:focus:ring-emerald-500 [&>select]:bg-white [&>select]:outline-none">
                            {{ form.membre }}
                        </div>
                    </div>

                    <!-- Montant -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Montant du dépôt (BIF)</label>
                        <div class="[&>input]:w-full [&>input]:px-4 [&>input]:py-2.5 [&>input]:rounded-lg [&>input]:border [&>input]:border-gray-300 [&>input]:focus:ring-2 [&>input]:focus:ring-emerald-500 [&>input]:outline-none">
                            {{ form.montant }}
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Description / Motif (Optionnel)</label>
                        <div class="[&>textarea]:w-full [&>textarea]:px-4 [&>textarea]:py-2.5 [&>textarea]:rounded-lg [&>textarea]:border [&>textarea]:border-gray-300 [&>textarea]:focus:ring-2 [&>textarea]:focus:ring-emerald-500 [&>textarea]:outline-none">
                            {{ form.description }}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-4 pt-6 border-t border-gray-100">
                <a href="{% url 'core:partner_dashboard' %}" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition duration-150">
                    Annuler
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium shadow-md hover:shadow-lg transition duration-150 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Valider le dépôt
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
