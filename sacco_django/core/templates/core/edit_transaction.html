<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Transaction #{{ transaction.id }} - SaccoFINtech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Modifier la Transaction #{{ transaction.id }}</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Montant (BIF)</label>
                    <input type="text" name="montant" value="{{ transaction.montant }}" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <a href="{% url 'core:transaction_detail' transaction.id %}" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 text-sm font-medium">Annuler</a>
                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 text-sm font-medium">Enregistrer les modifications</button>
            </div>
        </form>
    </div>
</body>
</html>
