<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier Transaction #{{ transaction.id }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Modifier la Transaction #{{ transaction.id }}</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                {{ form.as_p }}
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <a href="{% url 'core:transaction_detail' transaction.id %}" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Annuler</a>
                <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Enregistrer les modifications</button>
            </div>
        </form>
    </div>
</body>
</html>
