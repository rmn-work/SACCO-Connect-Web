<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Refusé - SaccoFINtech</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full text-center border-t-4 border-red-500">
        <!-- Icône d'alerte -->
        <div class="flex justify-center mb-4">
            <svg class="h-16 w-16 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-2">Erreur 403</h1>
        <h2 class="text-xl font-semibold text-gray-600 mb-4">Accès Interdit</h2>

        <p class="text-gray-500 mb-8">
            Désolé, vous n'avez pas les autorisations nécessaires pour accéder à cette page ou effectuer cette action.
        </p>

        <div class="space-x-4">
            <a href="javascript:history.back()" class="inline-block px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded hover:bg-gray-300 transition duration-200">
                ← Retour
            </a>
            <a href="/" class="inline-block px-4 py-2 bg-blue-600 text-white font-semibold rounded hover:bg-blue-700 transition duration-200">
                Aller à l'accueil
            </a>
        </div>
    </div>
</body>
</html>
